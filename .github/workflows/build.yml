name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true
      - uses: actions/upload-artifact@v4
        with:
          name: Ember
          path: bin/Release/net10.0-windows/win-x64/publish/Ember.exe
      - if: startsWith(github.ref, 'refs/tags/v')
        run: |
          Compress-Archive bin/Release/net10.0-windows/win-x64/publish/Ember.exe Ember-${{ github.ref_name }}-win-x64.zip
          gh release create ${{ github.ref_name }} Ember-${{ github.ref_name }}-win-x64.zip --title ${{ github.ref_name }} --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
